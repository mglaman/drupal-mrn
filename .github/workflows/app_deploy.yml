name: "Deploy App"
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app_deploy.yml'
      - 'app/**'
permissions:
  contents: read
concurrency: app_build
jobs:
  build:
    name: "Build & deploy"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install Node"
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"
      - name: "npm install"
        working-directory: ./app
        run: "npm ci"
      - name: "npm test"
        working-directory: ./app
        run: "npm test"
      - name: "npm build"
        working-directory: ./app
        run: "npm run build"
      - name: "configure AWS"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Hashed assets go first so index.html never references files that have
      # not been uploaded yet. Their names change every build, so they can be
      # cached forever.
      - name: Deploy hashed assets
        working-directory: ./app
        run: aws s3 sync ./dist/assets s3://drupal-mrn-web/assets --cache-control "public,max-age=31536000,immutable"
      - name: Deploy site root
        working-directory: ./app
        run: aws s3 sync ./dist s3://drupal-mrn-web --exclude "assets/*" --cache-control "no-cache"
      - name: Invalidate CloudFront
        working-directory: ./app
        run: aws cloudfront create-invalidation --distribution-id E2CL99C9FHPLRG --paths "/*"
