name: "Test App PR"
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/app_pr.yml'
      - 'app/**'
permissions:
  contents: read
# Cancel the previous run when a PR gets a new push.
concurrency:
  group: app-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install Node"
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"
      - name: "npm install"
        working-directory: ./app
        run: "npm ci"
      - name: "npm test"
        working-directory: ./app
        run: "npm test"
      - name: "npm build"
        working-directory: ./app
        run: "npm run build"
